apiVersion: v1
kind: Namespace
metadata:
  name: exercise1-2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: exercise1-2
  name: todo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      containers:
      - name: todo-app
        image: todo-app:1.2
        imagePullPolicy: Never
        env:
        - name: PORT
          value: "8080"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  namespace: exercise1-2
  name: todo-app
spec:
  selector:
    app: todo-app
  ports:
  - port: 80
    targetPort: 8080
